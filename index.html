<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c59"><title>Personal Engineering Notebook</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./style.css"></head>
<body><header><button id="menu" aria-label="Open contents">☰</button><b class="logo">EN</b><input id="book-title" value="My Engineering Notebook" aria-label="Notebook title"><span id="status">Saved locally</span></header>
<main><aside id="sidebar"><div class="side-head"><b>CONTENTS</b><button id="add-chapter">＋ Chapter</button></div><nav id="tree"></nav><div class="backup"><button id="export-backup">Export backup</button><label>Import backup<input id="import-backup" type="file" accept=".json,application/json"></label></div></aside>
<section id="workspace"><div id="welcome"><div class="book">EN</div><h1>Start with a blank page</h1><p>Create chapters and nested sections for your engineering notes. Everything is stored on this device and works offline.</p><button id="first-chapter">＋ Create first chapter</button></div><div id="chapter-view" hidden></div><div id="section-view" hidden><div class="section-head"><small id="section-number"></small><input id="section-title" aria-label="Section title"><div class="actions"><button id="add-subsection">＋ Subsection</button><button id="pdf-section">PDF</button><button id="delete-section" class="danger">Delete</button></div></div><div id="toolbar"><select id="format"><option value="p">Paragraph</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="blockquote">Quote</option></select><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="insertUnorderedList">• List</button><button data-cmd="insertOrderedList">1. List</button><label>A<input id="text-color" type="color"></label><label>▰<input id="highlight-color" type="color" value="#fff0a8"></label></div><div id="editor" contenteditable="true" data-placeholder="Write your notes here…"></div></div></section></main>
<dialog id="confirm"><h2>Delete this item?</h2><p>Nested subsections will also be deleted. This cannot be undone.</p><div><button id="cancel-delete">Cancel</button><button id="confirm-delete" class="danger-solid">Delete</button></div></dialog>
<script src="./app.js"></script></body></html>
